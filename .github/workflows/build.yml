name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src/DialControllerTools.csproj

      - name: Build
        run: msbuild src/DialControllerTools.csproj /p:configuration=Release /p:DeployExtension=false /v:m

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DialToolsForVS.vsix
          path: src/bin/Release/*.vsix
